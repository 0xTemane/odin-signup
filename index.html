<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="left">
        <img src="./image/bmw-side-left-image.jpg" id="bg-image-left">
        <div class="black-caption">
            <img src="./image/odin-lined.png" alt="Odin Logo" id="odin-logo">
            <h1>Odin</h1>
        </div>
        <div class="attribution">
            <p>Photo by <a href="https://unsplash.com/@nikolalsvk">Nikola Duza</a> on <a href="https://unsplash.com">Unsplash</a></p>
        </div>
    </div>
    <div class="right">
        <h2>This is not a real online service! But we need something like this to believe in our dreams...
            <br>Sign up now to get started!
        </h2>
        <h2>You <em>Know</em> what you have to do.</h2>
        <form action="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
            <fieldset>
                <legend><strong>Let's do this!</strong></legend>
                <div class="input-container">
                    <label for="first_name">First Name</label>
                    <input type="text" name="first_name" id="first_name" minlength="2" required>
                </div>
                <div class="input-container">
                    <label for="last_name">Last Name</label>
                    <input type="text" name="last_name" id="last_name" minlength="2" required>
                </div>
                <div class="input-container">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="input-container">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" name="phone_number" id="phone_number" minlength="6" required>
                </div>
                <div class="input-container">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" minlength="8" maxlength="20" required>
                </div>
                <div class="input-container">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" required minlength="8" maxlength="20">
                </div>
            </fieldset>
            <div class="checkbox-container">
                <label><input type="checkbox" name="human" id="human" value="YES" required> Wait! Are you an human?</label>
            </div>
            <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
